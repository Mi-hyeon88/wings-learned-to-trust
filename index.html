<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>As Wings Learned to Trust</title>

<style>
body{
    margin:0;
    background:linear-gradient(to bottom,#05060a,#0d0d12,#171923);
    background-attachment:fixed;
    font-family:Arial, sans-serif;
    color:white;
    text-align:center;
}

h1{
    margin-top:40px;
    font-size:32px;
}

p{
    color:#cfcfcf;
}

#intro{
    transition: opacity 1s ease;
}

#story{
    display:none;
}

img{
    width:90%;
    max-width:900px;
    margin:30px auto;
    display:block;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,.5);
opacity:0;
transform:translateY(30px);
transition:opacity .8s ease, transform .8s ease;
}

button{
    background:#ffffff;
    color:#0d0d12;
    border:none;
    padding:16px 40px;
    font-size:18px;
    border-radius:999px;
    cursor:pointer;
    margin:40px auto;
    display:block;
    font-weight:bold;
    transition:all .3s ease;
}

button:hover{
    transform:scale(1.05);
    background:#f0f0f0;
}
    img.show{
    opacity:1;
    transform:translateY(0);
    }
</style>

</head>

<body>
<div id="intro">

<h1>🪽</h1>

<h1>As Wings Learned to Trust</h1>

<p>A symbolic story about fear, sincerity and respect.</p>

<button id="beginButton">Begin</button>

</div>

<div id="story">
<img src="page1.png" alt="Page 1">
<img src="page2.png" alt="Page 2">
<img src="page3.png" alt="Page 3">
<img src="page4.png" alt="Page 4">
<img src="page5.png" alt="Page 5">
<img src="page6.png" alt="Page 6">
</div>
<button id="nextButton" style="display:none;">Next Chapter →</button>


<script>
const button = document.getElementById("beginButton");
const intro = document.getElementById("intro");
const story = document.getElementById("story");
const nextButton = document.getElementById("nextButton");
button.onclick = function() {

    intro.style.opacity = "0";

    setTimeout(function() {

        intro.style.display = "none";
        story.style.display = "block";
        nextButton.style.display = "inline-block";

        story.scrollIntoView({
            behavior: "smooth"
        });

    }, 1000);

};
    nextButton.onclick = function() {
    window.location.href = "chapter2.html";
};
    const images = document.querySelectorAll("img");

const observer = new IntersectionObserver(function(entries){

    entries.forEach(function(entry){

        if(entry.isIntersecting){
            entry.target.classList.add("show");
        }

    });

});

images.forEach(function(img){
    observer.observe(img);
});
</script>
</body>
</html>
