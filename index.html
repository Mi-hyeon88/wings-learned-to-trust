<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
<title>As Wings Learned to Trust</title>
    
<style>
body{
    margin:0;
    overflow:hidden;
    background:linear-gradient(to bottom,#05060a,#0d0d12,#171923);
    background-attachment:fixed;
    font-family:'Cormorant Garamond', serif;
    color:white;
    text-align:center;
}

h1{
    margin:0;

    font-size:42px;

    font-weight:600;

    letter-spacing:3px;

    line-height:1.2;

    color:#ffffff;

    text-shadow:
        0 0 12px rgba(255,255,255,.15),
        0 0 30px rgba(255,255,255,.08);
}
     p{
    color:#cfcfcf;
    font-size:20px;
    line-height:1.8;
 }
.subtitle{
    margin-top:12px;
    font-size:18px;
    letter-spacing:2px;
    color:rgba(255,255,255,.75);
    font-style:italic;
}
#intro{
    position:relative;
    height:100vh;
    min-height:100vh;
    overflow:hidden;
    isolation:isolate;
}
    .page{
    max-width:900px;
    margin:0 auto 70px;
    padding:0 16px;
    box-sizing:border-box;
    }

#intro::after{
    content:"";
    position:absolute;
    inset:0;

    background:url("cover.png") center 20%/118% no-repeat;

    opacity:.38;

    transform:scale(1.03);

    animation:slowZoom 18s ease-in-out infinite alternate;

    z-index:0;
}

#intro::before{
    content:"";
    position:absolute;
    inset:0;

    background:
    linear-gradient(
        to bottom,
        rgba(0,0,0,.35),
        rgba(0,0,0,.55),
        rgba(0,0,0,.75)
    );

    z-index:1;
}

#overlay{
    position:absolute;
    inset:0;
    z-index:2;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    gap:32px;

    text-align:center;

    padding:40px;
}

#overlay h1{
    margin:0;

    color:#fff;

    font-size:40px;

    line-height:1.12;

    letter-spacing:2px;

    max-width:90%;

    text-shadow:
        0 4px 20px rgba(0,0,0,.95),
        0 0 40px rgba(0,0,0,.6);
}

#beginButton{
    padding:16px 48px;

    border:1px solid rgba(255,255,255,.22);

    border-radius:999px;

    background:rgba(15,15,18,.55);

    backdrop-filter:blur(10px);

    color:#f5f2eb;

    font-family:'Cormorant Garamond',serif;

    font-size:24px;

    letter-spacing:4px;

    cursor:pointer;

    transition:.3s;
}

#beginButton:hover{
    transform:translateY(-2px);

    background:rgba(25,25,30,.75);

    border-color:rgba(255,255,255,.45);
}

@keyframes slowZoom{
    from{
        transform:scale(1.03);
    }
    to{
        transform:scale(1.09);
    }
#story{
    display:none;
}

#story img{
    width:100%;
    margin:30px auto;
    display:block;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,.5);
opacity:1;
transform:translateY(0px);
transition:opacity .8s ease, transform .8s ease;
}

#overlay{
    position:absolute;
    top:0;
    left:0;
    right:0;
    bottom:0;

    z-index:2;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    gap:32px;

    padding:40px;

    background:rgba(0,0,0,.45);
}

#overlay h1{
    margin:0;

    color:#ffffff;

    font-size:40px;

    font-weight:700;

    line-height:1.15;

    letter-spacing:2px;

    text-align:center;

    max-width:90%;

    text-shadow:
        0 4px 20px rgba(0,0,0,.95),
        0 0 40px rgba(0,0,0,.9);
}

    from{
        transform:scale(1.02);
    }
    to{
        transform:scale(1.08);
    }
</style>

</head>

<body>
<div id="intro">

    <div id="overlay">

        <h1>날개가 믿음을 배우던 날</h1>

<p class="subtitle">As Wings Learned to Trust</p>

        <button id="beginButton">Begin</button>

       </div>

</div>

<div id="story">

<div class="page">
    <img src="page1.png" alt="Page 1">
</div>
<div class="page">
    <img src="page2.png" alt="Page 2">
</div>
 <div class="page">
        <img src="page3.png" alt="Page 3">
 </div>
<div class="page">
        <img src="page4.png" alt="Page 4">
</div>
<div class="page">
        <img src="page5.png" alt="Page 5">
</div>
<div class="page">
        <img src="page6.png" alt="Page 6">
</div>
</div>


<script>
const button = document.getElementById("beginButton");
const intro = document.getElementById("intro");
const story = document.getElementById("story");
button.onclick = function() {

    intro.style.opacity = "0";

    setTimeout(function() {

        intro.style.display = "none";
        story.style.display = "block";

        story.scrollIntoView({
            behavior: "smooth"
        });

    }, 1000);

};
</script>
</body>
</html>
