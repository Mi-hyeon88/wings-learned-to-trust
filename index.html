<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
<title>As Wings Learned to Trust</title>

<style>
body{
    margin:0;
    background:linear-gradient(to bottom,#05060a,#0d0d12,#171923);
    background-attachment:fixed;
    font-family:'Cormorant Garamond', serif;
    color:white;
    text-align:center;
}

h1{
    letter-spacing:2px;
    text-shadow:0 0 25px rgba(255,255,255,.15);
    margin-top:40px;
    font-size:48px;
    font-weight:600;
}
     p{
     color:#cfcfcf;
     font-size:20px;
     line-height:1.8;
 }

#intro{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
    transition:opacity 1s ease;

    background-image:url("cover.png");
    background-size:cover;
    background-position:center top;
background-repeat:no-repeat;
background-size:115%;
}
#intro::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:0;
}
#story{
    display:block;
}

#story img{
    width:90%;
    max-width:900px;
    margin:30px auto;
    display:block;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,.5);
opacity:0;
transform:translateY(30px);
transition:opacity .8s ease, transform .8s ease;
}

button{
    background:rgba(15,15,20,.75);
    color:#f3f0ea;
    border:1px solid rgba(212,188,122,.45);
    padding:14px 42px;
    font-size:18px;
    border-radius:999px;
    cursor:pointer;
    font-family:'Cormorant Garamond', serif;
    letter-spacing:2px;
    transition:all .3s ease;
    backdrop-filter:blur(6px);
}

button:hover{
    background:rgba(30,30,40,.9);
    border-color:rgba(212,188,122,.8);
    transform:scale(1.03);
}
    img.show{
    opacity:1;
    transform:translateY(0);
    }
        @keyframes floating{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-8px);
    }

    100%{
        transform:translateY(0px);
    }

#overlay{
    position:relative;
z-index:1;
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding-bottom:180px;
    background:rgba(0,0,0,.82);
    );
}

#overlay h1{
    color:white;
    font-size:50px;
    letter-spacing:5px;
    margin-bottom:20px;
    text-shadow:0 5px 20px rgba(0,0,0,.9);
}


@keyframes slowZoom{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.08);
    }
</style>

</head>

<body>
<div id="intro">

    <div id="overlay">

        <h1>As Wings Learned to Trust</h1>

        <button id="beginButton">Begin</button>

       </div>

</div>

<div id="story">

<img src="page1.png" alt="Page 1">
<img src="page2.png" alt="Page 2">
<img src="page3.png" alt="Page 3">
<img src="page4.png" alt="Page 4">
<img src="page5.png" alt="Page 5">
<img src="page6.png" alt="Page 6">
</div>
<button id="nextButton" style="display:none;">Next Chapter →</button>


<script>
const button = document.getElementById("beginButton");
const intro = document.getElementById("intro");
const story = document.getElementById("story");
const nextButton = document.getElementById("nextButton");
button.onclick = function() {

    intro.style.opacity = "0";

    setTimeout(function() {

        intro.style.display = "none";
        story.style.display = "block";
        nextButton.style.display = "inline-block";

        story.scrollIntoView({
            behavior: "smooth"
        });

    }, 1000);

};
    nextButton.onclick = function() {
    window.location.href = "chapter2.html";
};
    const images = document.querySelectorAll("img");

const observer = new IntersectionObserver(function(entries){

    entries.forEach(function(entry){

        if(entry.isIntersecting){
            entry.target.classList.add("show");
        }

    });

});

images.forEach(function(img){
    observer.observe(img);
});
</script>
</body>
</html>
