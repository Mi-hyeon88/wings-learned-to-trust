<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
<title>As Wings Learned to Trust</title>
    
}
<style>
body{
    margin:0;
    background:linear-gradient(to bottom,#05060a,#0d0d12,#171923);
    background-attachment:fixed;
    font-family:'Cormorant Garamond', serif;
    color:white;
    text-align:center;
}

h1{
    margin:0;

    font-size:42px;

    font-weight:600;

    letter-spacing:3px;

    line-height:1.2;

    color:#ffffff;

    text-shadow:
        0 0 12px rgba(255,255,255,.15),
        0 0 30px rgba(255,255,255,.08);
}
     p{
     color:#cfcfcf;
     font-size:20px;
     line-height:1.8;
 }

#intro{
    position:relative;
    isolation:isolate;
    min-height:100vh;
height:100svh;
    overflow:hidden;
    transition:opacity 1s ease;

}
    #intro::after{
    content:"";
    position:absolute;
    inset:0;

    background-image:url("cover.png");
    background-size:118%;
    background-position:center 20%;
    background-repeat:no-repeat;

    opacity:.35;

    transform:scale(1.02);

        
    z-index:0;
    }
#intro::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.82);
    z-index:1;
}
#story{
    display:block;
}

#story img{
    width:min(92%,900px);
    max-width:900px;
    margin:30px auto;
    display:block;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,.5);
opacity:1;
transform:translateY(0px);
transition:opacity .8s ease, transform .8s ease;
}

button{
    background:rgba(18,18,25,.70);
    color:#f6f2e8;

    border:1px solid rgba(212,188,122,.35);

    padding:15px 44px;

    font-size:18px;

    font-family:'Cormorant Garamond', serif;

    letter-spacing:3px;

    border-radius:999px;

    cursor:pointer;

    backdrop-filter:blur(8px);

    box-shadow:0 0 25px rgba(212,188,122,.15);

    transition:.3s ease;
}

button:hover{
    background:rgba(30,30,40,.90);

    border-color:rgba(212,188,122,.70);

    box-shadow:0 0 35px rgba(212,188,122,.25);

    transform:scale(1.04);
}
    img.show{
    opacity:1;
    transform:translateY(0);
    }
        @keyframes floating{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-8px);
    }

    100%{
        transform:translateY(0px);
    }

#overlay{
    position:absolute;
    inset:0;
    z-index:2;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:0 30px;

    background:rgba(0,0,0,.88);
}

#overlay h1{
    color:#ffffff;

    font-size:38px;

    max-width:90%;

    line-height:1.15;

    letter-spacing:3px;

    margin-bottom:36px;

    text-shadow:
        0 3px 12px rgba(0,0,0,.9),
        0 0 25px rgba(255,255,255,.08);
}


@keyframes slowZoom{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.08);
    }
</style>

</head>

<body>
<div id="intro">

    <div id="overlay">

        <h1>As Wings Learned to Trust</h1>

        <button id="beginButton">Begin</button>

       </div>

</div>

<div id="story">

<img src="page1.png" alt="Page 1">
<img src="page2.png" alt="Page 2">
<img src="page3.png" alt="Page 3">
<img src="page4.png" alt="Page 4">
<img src="page5.png" alt="Page 5">
<img src="page6.png" alt="Page 6">
</div>
<button id="nextButton" style="display:none;">Next Chapter →</button>


<script>
const button = document.getElementById("beginButton");
const intro = document.getElementById("intro");
const story = document.getElementById("story");
const nextButton = document.getElementById("nextButton");
button.onclick = function() {

    intro.style.opacity = "0";

    setTimeout(function() {

        intro.style.display = "none";
        story.style.display = "block";
        nextButton.style.display = "inline-block";

        story.scrollIntoView({
            behavior: "smooth"
        });

    }, 1000);

};
    nextButton.onclick = function() {
    window.location.href = "chapter2.html";
};
</script>
</body>
</html>
